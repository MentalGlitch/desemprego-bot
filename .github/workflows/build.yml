name: Compilar Desemprego Bot

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Mostrar arquivos do repositório
        shell: pwsh
        run: |
          Write-Host "Arquivos Python encontrados:"
          Get-ChildItem -Path . -Recurse -File -Filter "*.py" | ForEach-Object { Write-Host $_.FullName }

      - name: Localizar o programa principal
        shell: pwsh
        run: |
          $arquivo = Get-ChildItem -Path . -Recurse -File -Filter "desemprego_bot_melhorado.py" | Select-Object -First 1
          if (-not $arquivo) {
            Write-Host "ERRO: desemprego_bot_melhorado.py não foi encontrado."
            Write-Host "Renomeie o arquivo no GitHub exatamente para desemprego_bot_melhorado.py ou altere o nome neste workflow."
            exit 1
          }
          "SCRIPT_PATH=$($arquivo.FullName)" >> $env:GITHUB_ENV
          Write-Host "Usando: $($arquivo.FullName)"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compilar programa
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --noconsole --onedir `
            --name "Desemprego Bot" `
            --icon "programa_image\icon.ico" `
            --collect-all pygame `
            --add-data "audios;audios" `
            --add-data "programa_image;programa_image" `
            --add-data "imagem.png;." `
            "$env:SCRIPT_PATH"

      - name: Compactar programa
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\Desemprego Bot" `
            -DestinationPath "Desemprego-Bot-Windows.zip"

      - name: Disponibilizar compilação
        uses: actions/upload-artifact@v4
        with:
          name: Desemprego-Bot-Windows
          path: Desemprego-Bot-Windows.zip

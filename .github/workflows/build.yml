name: Compilar Desemprego Bot

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar programa
        run: |
          python -m PyInstaller --noconfirm --clean --noconsole --onedir `
            --name "Desemprego Bot" `
            --icon "programa_image\icon.ico" `
            --collect-all pygame `
            --add-data "audios;audios" `
            --add-data "programa_image;programa_image" `
            --add-data "imagem.png;." `
            desemprego_bot_melhorado.py

      - name: Compactar programa
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\Desemprego Bot" `
            -DestinationPath "Desemprego-Bot-Windows.zip"

      - name: Disponibilizar compilação
        uses: actions/upload-artifact@v4
        with:
          name: Desemprego-Bot-Windows
          path: Desemprego-Bot-Windows.zip
